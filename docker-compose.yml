version: "3.9"

services:
  # Database Service
  postgres:
    image: postgres:16-alpine
    container_name: migrion-postgres
    restart: always
    environment:
      POSTGRES_USER: migrion
      POSTGRES_PASSWORD: migrion_pw
      POSTGRES_DB: migrion
    volumes:
      - migrion_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - migrion-net

  # Cache Service
  redis:
    image: redis:7-alpine
    container_name: migrion-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - migrion-net

  # Backend API
  api:
    build: 
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: migrion-api
    restart: always
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://migrion:migrion_pw@postgres:5432/migrion
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
    networks:
      - migrion-net

  # Frontend Web App
  web:
    build: 
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: migrion-web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - migrion-net

  # CMS (Directus)
  cms:
    image: directus/directus:10.12.1
    container_name: migrion-cms
    restart: always
    environment:
      KEY: "migrion-root-secret-key"
      SECRET: "migrion-root-secret"
      ADMIN_EMAIL: "admin@migrion.local"
      ADMIN_PASSWORD: "admin"
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "migrion"
      DB_USER: "migrion"
      DB_PASSWORD: "migrion_pw"
    depends_on:
      - postgres
    ports:
      - "8055:8055"
    networks:
      - migrion-net

volumes:
  migrion_pg:

networks:
  migrion-net:
    driver: bridge
